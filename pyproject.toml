[project]
name = "medquiz-generator"
version = "0.1.0"
description = "Systematic, verifiable SSM-style multiple-choice question generation from native medical PDFs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "docling>=2.97.0",
    "langchain-core>=0.3.60",
    "langchain-openai>=0.3.20",
    "langchain-anthropic>=0.3.15",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "streamlit>=1.45.0",
    # Declared directly so [tool.uv.sources] can route them to the CPU-only index;
    # uv ignores sources for transitive deps. Both arrive anyway via docling.
    "torch>=2.14",
    "torchvision>=0.29",
    "typer>=0.15.0",
    "onnxruntime>=1.29.0",
]

[project.scripts]
medquiz = "medquiz_generator.entrypoints.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "mypy>=1.15",
    "pip-licenses>=5.0",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medquiz_generator"]

# CPU-only torch on Linux keeps the Docling install small (no CUDA wheels).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["pdf-split", "runs", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["medquiz_generator"]

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "streamlit.*", "langsmith.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval' -q"
markers = [
    "unit: fast unit tests with fakes",
    "integration: tests wiring several modules together (still no network)",
    "eval: opt-in LLM evaluation harness, needs an API key (make test-eval)",
]

[tool.coverage.run]
branch = true
source = ["medquiz_generator"]
omit = ["*/entrypoints/streamlit_app.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
